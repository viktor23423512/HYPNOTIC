name: Feature request
description: Suggest an improvement to the player or visualizers.
title: "[Feature] "
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or improve?
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: How would you use it?
      description: Examples or visual references are welcome.
